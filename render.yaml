services:
  - type: web
    name: rewardhub
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PRIVATE_KEY
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        value: 0xD1880b4a686fA011498ca415B703762B926bA99a
      - key: VITE_API_BASE_URL
        value: /api
      - key: VITE_BLOCKCHAIN_NETWORK
        value: sepolia
      - key: VITE_CONTRACT_ADDRESS
        value: 0xD1880b4a686fA011498ca415B703762B926bA99a
